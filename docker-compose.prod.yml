# ─────────────────────────────────────────────────────────────────────────────
# MaxAlgos — Production Docker Compose (Contabo server)
#
# Domain  : api.maxalgos.com
# Ports   : Flask → host 5001, WebSocket → host 8765
# Network : maxalgos-net  (isolated; never touches alphasync-* containers)
#
# Usage   : docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: maxalgos-postgres
    environment:
      # POSTGRES_PASSWORD is read from the host .env via env_file below so the
      # password never sits in this compose file itself. .env must define:
      #   POSTGRES_PASSWORD=<a real secret>
      - POSTGRES_USER=maxalgos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=maxalgos
    env_file:
      - /opt/maxalgos/.env
    volumes:
      - maxalgos_pgdata:/var/lib/postgresql/data
    # No "ports:" mapping deliberately — Postgres is reachable from
    # maxalgos-web via the shared maxalgos-net network at hostname
    # "postgres", and is NOT exposed on the host/public internet. This
    # server also runs the unrelated alphasync project; keeping Postgres
    # off any host port avoids it becoming reachable outside this compose
    # project's own network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxalgos -d maxalgos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - maxalgos-net

  maxalgos-web:
    depends_on:
      postgres:
        condition: service_healthy
    # IMPORTANT -- depends_on/service_healthy above only guarantees the
    # postgres CONTAINER is running and accepting connections; it does NOT
    # mean the app actually uses it. maxalgos-web reads DATABASE_URL (and
    # LATENCY_DATABASE_URL / LOGS_DATABASE_URL / HEALTH_DATABASE_URL /
    # SANDBOX_DATABASE_URL) from /opt/maxalgos/.env (mounted below), which
    # is loaded with override=True (see utils/env_check.py) -- so it wins
    # over anything set in this compose file's `environment:` list. If
    # that .env still has the sqlite:/// defaults from .sample.env (the
    # common case: CI/deploy just copies .sample.env on first run), this
    # container starts a Postgres instance the app never actually talks
    # to, and every write still goes to the SQLite files in the
    # maxalgos_db volume. To really use Postgres, /opt/maxalgos/.env on
    # the server itself must set (see .sample.env's "maxalgos Database
    # Configuration" section for the full list and pool-sizing notes):
    #   DATABASE_URL=postgresql://maxalgos:${POSTGRES_PASSWORD}@postgres:5432/maxalgos
    # (repeat the pattern for LATENCY_/LOGS_/HEALTH_/SANDBOX_DATABASE_URL
    # if you want those migrated too -- HISTORIFY_DATABASE_URL always stays
    # DuckDB regardless, see database/historify_db.py). Run
    # upgrade/migrate_sqlite_to_postgres.py BEFORE flipping this, and
    # verify its row-count check passes, or the app will start against an
    # empty Postgres database.
    # Image is built on the server via: docker compose -f docker-compose.prod.yml build
    image: maxalgos:latest
    build:
      context: .          # repo root — docker-compose.prod.yml lives here
      dockerfile: Dockerfile
    container_name: maxalgos-web

    # ── Port mapping ──────────────────────────────────────────────────────────
    # Flask on 5001 so it doesn't clash with any existing 5000/5050 services.
    # Nginx/reverse-proxy on the host should forward api.maxalgos.com → 5001.
    # WebSocket stays on 8765 (standard for this project).
    #
    # IMPORTANT -- since this container sits behind nginx (above), every
    # request Flask sees actually originates from nginx's own connection,
    # not the real end user. utils/ip_helper.py's get_real_ip() defaults to
    # TRUST_PROXY_HEADERS=FALSE (see its own docstring) precisely so a
    # client reaching gunicorn directly can't spoof X-Forwarded-For/
    # X-Real-IP to fake their IP -- but that means it returns
    # request.remote_addr as-is, which for a container behind a host-level
    # nginx reverse proxy is the Docker bridge network's OWN gateway IP
    # (classically something like 172.x.x.1), NOT the real client. This is
    # exactly why /active-sessions showed every login as IP 172.20.0.1
    # regardless of who actually logged in. install.sh and
    # install-docker.sh both auto-flip this to TRUE during their install
    # (they configure the matching nginx `X-Real-IP`/`X-Forwarded-For`
    # headers as part of the same install step) -- this compose file has
    # no equivalent automated step, since it assumes an already-existing,
    # separately-managed nginx on the host. /opt/maxalgos/.env on THIS
    # server must set:
    #   TRUST_PROXY_HEADERS=TRUE
    # -- but ONLY after confirming the host's nginx vhost for
    # api.maxalgos.com sets `proxy_set_header X-Real-IP $remote_addr;` and
    # `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;` (see
    # install.sh's generated vhost for the exact directives to copy) --
    # flipping this ON without nginx actually setting those headers, or
    # with gunicorn reachable by any other path, lets a client spoof their
    # own source IP and bypass the IP ban list / login rate limiter / 404
    # auto-ban tracker (see get_real_ip's docstring for the full warning).
    ports:
      - "8090:5000"
      - "8765:8785"

    # ── Volumes ───────────────────────────────────────────────────────────────
    # Named volumes are prefixed maxalgos_ so they never overlap with
    # alphasync_* volumes from the other project.
    volumes:
      - maxalgos_db:/app/db
      - maxalgos_log:/app/log
      - maxalgos_strategies:/app/strategies
      - maxalgos_keys:/app/keys
      - maxalgos_tmp:/app/tmp
      # Mount .env from a fixed host path that CI writes to
      - /opt/maxalgos/.env:/app/.env

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - TZ=Asia/Kolkata
      # Thread limits — prevent OpenBLAS/NumPy from spawning too many threads
      # and overloading the Contabo VPS when other containers are running.
      - OPENBLAS_NUM_THREADS=2
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
      - NUMBA_NUM_THREADS=2
      # Keep memory footprint predictable
      - STRATEGY_MEMORY_LIMIT_MB=512

    # ── Resource limits (prevent server overload) ─────────────────────────────
    # Adjust to match your Contabo VPS spec. These values suit a 4–8 vCPU /
    # 8–16 GB RAM node shared with alphasync.
    deploy:
      resources:
        limits:
          cpus: '2.0'       # never use more than 2 vCPUs
          memory: 3G        # hard ceiling; OOM-killer kicks in above this
        reservations:
          cpus: '0.5'       # guaranteed minimum so other containers aren't starved
          memory: 512M

    # ── Shared memory (scipy / numba) ─────────────────────────────────────────
    shm_size: '256m'

    # ── Health check ──────────────────────────────────────────────────────────
    # /auth/healthz does no DB/broker work and is exempt from rate limiting,
    # unlike the /auth/check-setup probe this replaced -- that one ran a DB
    # query on the same single gunicorn worker serving user traffic, so a
    # request flood starved it, Docker marked the container unhealthy, and
    # nginx 504'd every route. See blueprints/auth.py::healthz.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/auth/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s     # give gunicorn time to boot before first probe

    restart: unless-stopped

    # ── Isolated network ──────────────────────────────────────────────────────
    networks:
      - maxalgos-net

# ── Named volumes (maxalgos_ prefix ensures no collision with alphasync_*) ────
volumes:
  maxalgos_db:
    driver: local
  maxalgos_log:
    driver: local
  maxalgos_strategies:
    driver: local
  maxalgos_keys:
    driver: local
  maxalgos_tmp:
    driver: local
  maxalgos_pgdata:
    driver: local

# ── Dedicated bridge network (no overlap with alphasync project network) ───────
networks:
  maxalgos-net:
    driver: bridge
    name: maxalgos-net
